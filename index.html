<script type="module">
// ── FIREBASE CONFIG ──
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, where, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC9UvDKVYcq-KU-AjN4dDANK-c11Z72JSs",
  authDomain: "fournildejean-7803b.firebaseapp.com",
  projectId: "fournildejean-7803b",
  storageBucket: "fournildejean-7803b.firebasestorage.app",
  messagingSenderId: "448534729811",
  appId: "1:448534729811:web:4d19f58011190b10cfe2a6"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

// ── HELPERS FIREBASE ──
async function fbSave(collection_name, id, data) {
  try {
    await setDoc(doc(db, collection_name, id), data, { merge: true });
  } catch(e) { console.error('Firebase save error:', e); }
}

async function fbDelete(collection_name, id) {
  try { await deleteDoc(doc(db, collection_name, id)); }
  catch(e) { console.error('Firebase delete error:', e); }
}

function fbListen(collection_name, id, callback) {
  return onSnapshot(doc(db, collection_name, id), (snap) => {
    if(snap.exists()) callback(snap.data());
  });
}

function fbListenCollection(collection_name, callback) {
  return onSnapshot(collection(db, collection_name), (snap) => {
    const data = {};
    snap.forEach(d => { data[d.id] = d.data(); });
    callback(data);
  });
}

// ── EXPOSER FIREBASE GLOBALEMENT ──
window.fbSave = fbSave;
window.fbDelete = fbDelete;
window.fbListen = fbListen;
window.fbListenCollection = fbListenCollection;
window.fbDb = db;
window.fbReady = true;
// Exposer les modules pour usage externe
window.fbModules = { getDoc, doc, setDoc, collection, onSnapshot, deleteDoc, getDocs };

// ── ÉCOUTE EN TEMPS RÉEL ──
// Livreurs
fbListenCollection('fdj-livreurs', function(data) {
  if(typeof window.onFbLivreurs === 'function') window.onFbLivreurs(data);
});

// Livraisons du jour courant
function listenTodayDeliveries(date) {
  return onSnapshot(doc(db, 'fdj-tournees', date), function(snap) {
    if(snap.exists() && typeof window.onFbDeliveries === 'function') {
      window.onFbDeliveries(snap.data().deliveries || []);
    }
  });
}
window.listenTodayDeliveries = listenTodayDeliveries;

// Camions du jour
function listenCamions(date) {
  return onSnapshot(doc(db, 'fdj-camions', date), function(snap) {
    if(snap.exists() && typeof window.onFbCamions === 'function') {
      window.onFbCamions(snap.data().camions || []);
    }
  });
}
window.listenCamions = listenCamions;

console.log('✅ Firebase FourniLive connecté');
</script>

.login-photo-bg::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(10,60,80,.55) 0%,rgba(26,18,8,.75) 100%);
}
.login-photo-content{
  position:relative;z-index:1;width:100%;max-width:400px;text-align:center;
}
.login-photo-seal{font-size:52px;margin-bottom:12px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));}
.login-photo-brand{font-family:var(--display);font-size:34px;font-weight:400;color:#fff;margin:0 0 4px;letter-spacing:.3px;text-shadow:0 2px 12px rgba(0,0,0,.5);}
.login-photo-sub{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.12em;text-transform:uppercase;margin-bottom:40px;}
.login-photo-btns{display:flex;flex-direction:column;gap:12px;}
.btn-photo{width:100%;padding:18px 16px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px;border:none;text-align:left;backdrop-filter:blur(8px);}
.btn-photo-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.btn-photo-text{flex:1;}
.btn-photo-label{display:block;font-size:15px;font-weight:700;}
.btn-photo-desc{display:block;font-size:11px;margin-top:2px;opacity:.65;font-weight:400;}
.btn-photo-livreur{background:rgba(247,243,236,.92);color:var(--ink);}
.btn-photo-livreur .btn-photo-icon{background:rgba(26,18,8,.1);}
.btn-photo-resp{background:rgba(10,104,120,.92);color:#fff;border:1px solid rgba(255,255,255,.2);}
.btn-photo-resp .btn-photo-icon{background:rgba(255,255,255,.15);}

.login-form-photo::before{content:'';position:absolute;inset:0;background:rgba(10,40,60,.75);}
.login-form-card{position:relative;z-index:1;width:100%;max-width:360px;background:rgba(255,255,255,.97);border-radius:20px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-form-card-teal{background:rgba(10,104,120,.95);}
.login-form-title{font-family:var(--display);font-size:22px;font-weight:400;margin:0 0 4px;text-align:center;}
.login-form-title-dark{color:var(--ink);}
.login-form-title-light{color:#fff;}
.login-form-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:24px;}
.login-form-sub-dark{color:var(--ink-3);}
.login-form-sub-light{color:rgba(255,255,255,.55);}

.btn-half{width:100%;padding:16px;border-radius:12px;font-family:var(--body);font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.02em;display:flex;align-items:center;gap:12px;border:none;}
.btn-half-livreur{background:var(--ink);color:var(--paper);}
.btn-half-teal{background:#fff;color:var(--teal);}
.btn-half-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.btn-half-livreur .btn-half-icon{background:rgba(255,255,255,.1);}
.btn-half-teal .btn-half-icon{background:var(--teal-l);}
.btn-half-text{text-align:left;flex:1;}
.btn-half-label{display:block;font-size:15px;font-weight:700;}
.btn-half-desc{display:block;font-size:11px;margin-top:2px;opacity:.6;font-weight:400;}

/* ── SOUS-ECRANS LOGIN ── */
.login-form{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.login-form-white{background:var(--paper);}
.login-form-teal{background:var(--teal);}
.form-seal{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.form-seal-white{background:var(--paper-2);border:2px solid var(--rule);font-size:28px;}
.form-seal-teal{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);font-size:28px;}
.form-seal span{font-family:var(--display);font-weight:700;font-size:16px;}
.form-seal-white span{color:var(--paper);}
.form-seal-teal span{color:#fff;}
.form-title{font-family:var(--display);font-size:24px;font-weight:400;margin-bottom:4px;text-align:center;}
.form-title-white{color:var(--ink);}
.form-title-teal{color:#fff;}
.form-sub{font-size:12px;margin-bottom:32px;text-align:center;letter-spacing:.06em;text-transform:uppercase;}
.form-sub-white{color:var(--ink-3);}
.form-sub-teal{color:rgba(255,255,255,.5);}
.form-card{width:100%;max-width:340px;}
.form-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px;}
.form-label-white{color:var(--ink-3);}
.form-label-teal{color:rgba(255,255,255,.6);}
.form-input{width:100%;padding:13px 14px;border-radius:10px;font-size:15px;font-family:var(--body);outline:none;margin-bottom:12px;transition:border-color .15s;}
.form-input-white{background:#fff;border:1.5px solid var(--rule);color:var(--ink);}
.form-input-white::placeholder{color:var(--ink-3);}
.form-input-white:focus{border-color:var(--ink);}
.form-input-teal{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;}
.form-input-teal::placeholder{color:rgba(255,255,255,.4);}
.form-input-teal:focus{border-color:#fff;}
.form-btn-white{width:100%;padding:14px;border-radius:10px;border:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer;margin-top:2px;}
.form-btn-teal{width:100%;padding:14px;border-radius:10px;border:none;background:#fff;color:var(--teal);font-weight:700;font-size:14px;cursor:pointer;margin-top:2px;}
.form-back{background:none;border:none;font-size:12px;cursor:pointer;margin-top:12px;display:block;text-align:center;width:100%;padding:8px;text-decoration:underline;letter-spacing:.04em;}
.form-back-white{color:var(--ink-3);}
.form-back-teal{color:rgba(255,255,255,.5);}
.form-error{font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
.form-error-white{color:var(--red);}
.form-error-teal{color:rgba(255,200,180,1);}

/* ── APP ── */
.shell{max-width:480px;margin:0 auto;padding:0 0 110px;}
.app-header{padding:20px 20px 0;border-bottom:2px solid var(--ink);}
.header-top{display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;}
.wheat-icon{font-size:32px;flex-shrink:0;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.15));}
.header-text{flex:1;min-width:0;}
.header-eyebrow{font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;margin-bottom:2px;}
.header-title{font-family:var(--display);font-size:21px;font-weight:400;color:var(--ink);letter-spacing:.2px;}
.header-role{font-size:10px;color:var(--ink-3);margin-top:2px;letter-spacing:.06em;}
.header-actions{display:flex;gap:6px;flex-shrink:0;padding-top:2px;margin-left:auto;}
.hbtn{padding:6px 10px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-2);letter-spacing:.04em;}
.hbtn-exit{background:var(--red-s);border-color:rgba(200,40,26,.2);color:var(--red);}
.app-sub{padding:8px 20px;background:var(--paper-2);font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--rule);letter-spacing:.04em;}
.date-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--rule);}
.date-arr{width:44px;height:44px;background:var(--paper);border:none;color:var(--ink);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.date-arr:first-child{border-right:1px solid var(--rule);}
.date-arr:last-child{border-left:1px solid var(--rule);}
.date-center{flex:1;text-align:center;padding:12px;background:var(--paper);border:none;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--body);}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--ink);}
.stat-cell{padding:10px 4px 8px;text-align:center;border-right:1px solid var(--rule);}
.stat-cell:last-child{border-right:none;}
.stat-num{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;color:var(--ink);}
.stat-lbl{font-size:8px;color:var(--ink-3);margin-top:3px;letter-spacing:.08em;text-transform:uppercase;}

/* REGISTRE */
.hour-block{margin-bottom:0;}
.hour-head{display:flex;align-items:center;gap:10px;padding:8px 20px 6px;background:var(--paper-2);border-bottom:1px solid var(--rule);border-top:1px solid var(--rule);}
.hour-num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);letter-spacing:.08em;}
.hour-rule{flex:1;height:1px;background:var(--rule);}
.delivery-row{width:100%;text-align:left;display:flex;align-items:stretch;background:var(--paper);border-bottom:1px solid var(--rule);cursor:pointer;font-family:var(--body);padding:0;position:relative;transition:background .1s;}
.delivery-row:active{background:var(--paper-2);}
.row-indicator{width:4px;flex-shrink:0;border-radius:0;}
.ind-pending{background:var(--amber);}
.ind-delivered{background:var(--green);}
.ind-absent,.ind-refused,.ind-incident{background:var(--red);}
.row-body{flex:1;padding:11px 16px 11px 12px;min-width:0;}
.row-top{display:flex;align-items:baseline;gap:10px;margin-bottom:3px;flex-wrap:wrap;}
.row-time{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex-shrink:0;}
.row-client{font-weight:700;font-size:14px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.spill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:.06em;text-transform:uppercase;}
.sp-pending{background:var(--amber-s);color:var(--amber);border:1px solid rgba(200,112,16,.2);}
.sp-delivered{background:var(--green-s);color:var(--green);border:1px solid rgba(42,122,58,.2);}
.sp-absent,.sp-refused,.sp-incident{background:var(--red-s);color:var(--red);border:1px solid rgba(200,40,26,.2);}
.row-driver{font-size:10px;color:var(--ink-3);}
.row-address{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty-state{padding:72px 24px;text-align:center;}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.35;}
.empty-title{font-family:var(--display);font-size:17px;font-weight:400;color:var(--ink-2);}
.empty-sub{font-size:12px;color:var(--ink-3);margin-top:6px;}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:12px;color:var(--ink-3);}
.spinner{width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);border-top-color:var(--ink);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:28px;line-height:1;cursor:pointer;z-index:30;box-shadow:0 4px 20px rgba(200,40,26,.4),0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-weight:300;}

/* CAMION */
.camion-card{padding:16px 20px;border-bottom:2px solid var(--ink);background:var(--paper);}
.camion-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:12px;}
.camion-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

var sigDrawing=false;
var sigCtx=null;
var sigCanvas=null;

function initSignatureCanvas(canvas){
  if(!canvas||canvas._sigInit) return;
  canvas._sigInit=true;
  var ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1A1208';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*window.devicePixelRatio;
  canvas.height=rect.height*window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  var drawing=false;
  function getPos(e){var r=canvas.getBoundingClientRect();var src=e.touches?e.touches[0]:e;return{x:src.clientX-r.left,y:src.clientY-r.top};}
  function start(e){e.preventDefault();drawing=true;var p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.classList.add('signed');}
  function move(e){e.preventDefault();if(!drawing)return;var p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
  function end(){drawing=false;}
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
}
function initSignature(){
  sigCanvas=document.getElementById('sig-canvas');
  if(!sigCanvas) return;
  sigCtx=sigCanvas.getContext('2d');
  sigCtx.strokeStyle='#1A1208';
  sigCtx.lineWidth=2.5;
  sigCtx.lineCap='round';
  sigCtx.lineJoin='round';
  // Ajuster résolution
  var rect=sigCanvas.getBoundingClientRect();
  sigCanvas.width=rect.width*window.devicePixelRatio;
  sigCanvas.height=rect.height*window.devicePixelRatio;
  sigCtx.scale(window.devicePixelRatio,window.devicePixelRatio);

  function getPos(e){
    var r=sigCanvas.getBoundingClientRect();
    var src=e.touches?e.touches[0]:e;
    return{x:src.clientX-r.left,y:src.clientY-r.top};
  }
  function start(e){e.preventDefault();sigDrawing=true;var p=getPos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);sigCanvas.classList.add('signed');}
  function move(e){e.preventDefault();if(!sigDrawing)return;var p=getPos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();}
  function end(e){sigDrawing=false;}
  sigCanvas.addEventListener('mousedown',start);
  sigCanvas.addEventListener('mousemove',move);
  sigCanvas.addEventListener('mouseup',end);
  sigCanvas.addEventListener('touchstart',start,{passive:false});
  sigCanvas.addEventListener('touchmove',move,{passive:false});
  sigCanvas.addEventListener('touchend',end);
}

function clearSignature(){
  if(!sigCtx||!sigCanvas)return;
  sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);
  sigCanvas.classList.remove('signed');
}

function getSignatureData(){
  if(!sigCanvas||!sigCanvas.classList.contains('signed'))return null;
  return sigCanvas.toDataURL('image/png');
}

    if(btn)btn.classList.remove('recording');

function parsePdfText(text){
  var lines=text.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var result={client:'',address:'',ref:'',instructions:'',time:'',date:''};

  // 1. Numéro BL
  var blNum=text.match(/N[°o\.\s]*(BL[\w\/\-]+)/i);
  if(blNum) result.ref=blNum[1].trim();

  // 2. Date
  var dateM=text.match(/Le\s*:\s*(\d{2}[\/\-]\d{2}[\/\-]\d{4})/i);
  if(dateM) result.date=dateM[1].trim();

  // 3. Rue du client (ignorer l'expéditeur)
  var streetIdx=-1;
  var skipStreet=/boulanger|facturation|standard|clermont/i;
  for(var i=0;i<lines.length;i++){
    if(/\d+\s+(avenue|rue|place|chemin|impasse|boulevard|allée|route)/i.test(lines[i])
       &&!skipStreet.test(lines[i])){
      streetIdx=i; break;
    }
  }

  if(streetIdx>=0){
    result.address=lines[streetIdx];
    // Chercher code postal avant ET après la rue (dans une fenêtre de 10 lignes)
    for(var j=Math.max(0,streetIdx-8);j<Math.min(lines.length,streetIdx+8);j++){
      if(j!==streetIdx&&/^\d{5}\s+/.test(lines[j])&&!/^6310/.test(lines[j])){
        result.address+=', '+lines[j]; break;
      }
    }
    // Client = ligne non-technique avant la rue
    for(var k=streetIdx-1;k>=0;k--){
      var prev=lines[k];
      if(prev&&prev.length>2
         &&!/^(le\s*:|n[°o]|page|code|d[eé]sign|quantit|standard|email|tél|tel|mob|sas|bon de|tourn|evenement|atelier|63[01]|\d{2}[\/\-])/i.test(prev)){
        result.client=prev; break;
      }
    }
  }

  // 4. Téléphone (premier numéro trouvé, une seule occurrence)
  var tel=text.match(/T[eé]l\s*[:\-]\s*([\d][\d\s\-\.]{8,14})/i);
  if(tel) result.instructions='Tél : '+tel[1].trim().replace(/\s+/g,'').substring(0,14);

  // 5. Heure
  var timeM=text.match(/ENTRE\s+(\d{1,2})H(\d{0,2})/i);
  if(timeM) result.time=String(timeM[1]).padStart(2,'0')+':'+(timeM[2]&&timeM[2].length?String(timeM[2]).padStart(2,'0'):'00');

  // 6. Instruction livraison
  var instrM=text.match(/LIVRAISON[^\n]{5,}/i);
  if(instrM) result.instructions=(result.instructions?result.instructions+' | ':'')+instrM[0].trim();

  // 7. Événement (MARIAGE xxx, BAPTEME xxx, etc. - avec mot suivant)
  var evtSp=text.match(/(MARIAGE\s+[^\n]+|BAPTEME\s+[^\n]+|ANNIVERSAIRE\s+[^\n]+|COMMUNION\s+[^\n]+|COCKTAIL\s+[^\n]+)/i);
  var evtName=evtSp?evtSp[1].trim():'';

  // 8. Produits — quantité sur même ligne OU sur la ligne suivante
  var products=[];
  var skipProd=/^(page|le\s*:|code|d[eé]sign|quantit|standard|facturation|tourn[eé]e|evenem|bon de|mariage|bapteme|anniversaire)/i;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    // Quantité sur même ligne : "Boule T80 65"
    var m1=l.match(/^(.{3,})\s+(\d{1,4})\s*$/);
    if(m1&&parseInt(m1[2])>0&&!skipProd.test(m1[1].trim())&&m1[1].trim().length>2){
      products.push(m1[1].trim()+' x'+m1[2]); continue;
    }
    // Quantité sur ligne suivante : "Boule T80" puis "65"
    if(i+1<lines.length&&/^\d{1,4}$/.test(lines[i+1].trim())){
      var qty=parseInt(lines[i+1].trim());
      if(qty>0&&l.length>2&&!skipProd.test(l)){
        products.push(l+' x'+qty); i++;
      }
    }
  }

  // 9. Stocker produits comme tableau {name, qty}
  result.blNum=result.ref; // garder le n° BL séparé
  var prodObjs=[];
  if(evtName) prodObjs.push({name:evtName,qty:''});
  products.forEach(function(p){
    var m=p.match(/^(.+?)\s+x(\d+)$/);
    if(m) prodObjs.push({name:m[1],qty:m[2]});
    else prodObjs.push({name:p,qty:''});
  });
  result.products=prodObjs;
  // Construire aussi la ref texte pour compatibilité
  var cmdParts=[];
  if(evtName) cmdParts.push(evtName);
  cmdParts=cmdParts.concat(products);
  if(cmdParts.length) result.ref=(result.ref?result.ref+' | ':'')+cmdParts.join(', ');

  return result;
}
function readPdf(file){state.pdfParsing=true;state.pdfData=null;render();var reader=new FileReader();reader.onload=function(e){pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise.then(function(pdf){var pages=[];for(var p=1;p<=pdf.numPages;p++)pages.push(p);Promise.all(pages.map(function(p){return pdf.getPage(p).then(function(pg){return pg.getTextContent().then(function(c){return c.items.map(function(it){return it.str;}).join('\n');});});})).then(function(texts){var parsed=parsePdfText(texts.join('\n'));state.pdfData=parsed;state.pdfParsing=false;render();setTimeout(function(){if(document.getElementById('f-client')&&parsed.client)document.getElementById('f-client').value=parsed.client;if(document.getElementById('f-address')&&parsed.address)document.getElementById('f-address').value=parsed.address;if(document.getElementById('f-ref')&&parsed.ref)document.getElementById('f-ref').value=parsed.ref;if(document.getElementById('f-instructions')&&parsed.instructions)document.getElementById('f-instructions').value=parsed.instructions;if(document.getElementById('f-time')&&parsed.time)document.getElementById('f-time').value=parsed.time;if(document.getElementById('f-date')&&parsed.date)document.getElementById('f-date').value=convertDate(parsed.date);},50);});}).catch(function(){state.pdfParsing=false;state.errorMsg='Erreur lecture PDF.';render();});};reader.readAsArrayBuffer(file);}

function load(date){
  state.loading=true;state.camions=loadCamions(date);render();
  // Local d'abord pour affichage rapide
  try{var raw=localStorage.getItem('fdj-tournee:'+date);state.deliveries=raw?(JSON.parse(raw)||[]):[];}catch(e){state.deliveries=[];}
  state.loading=false;render();
  // Firebase ensuite — écoute temps réel
  if(window.fbReady){
    if(window._unsubDeliveries) window._unsubDeliveries();
    window.onFbDeliveries=function(deliveries){
      state.deliveries=deliveries;
      try{localStorage.setItem('fdj-tournee:'+date,JSON.stringify(deliveries));}catch(e){}
      render();
    };
    window._unsubDeliveries=window.listenTodayDeliveries(date);
    if(window._unsubCamions) window._unsubCamions();
    window.onFbCamions=function(camions){
      state.camions=camions;
      try{localStorage.setItem('fdj-camions:'+date,JSON.stringify(camions));}catch(e){}
    };
    window._unsubCamions=window.listenCamions(date);
  }
}
function persist(list){
  state.deliveries=list;
  try{localStorage.setItem('fdj-tournee:'+state.date,JSON.stringify(list));}catch(e){state.errorMsg='Sauvegarde echouee.';}
  function doFbSave(){
    if(window.fbReady){
      window.fbSave('fdj-tournees', state.date, {deliveries:list, date:state.date, updatedAt:new Date().toISOString()});
    } else {
      setTimeout(doFbSave, 500); // retry si Firebase pas prêt

  }
  doFbSave();
}
